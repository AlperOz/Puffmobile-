name: APK derle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: En son yüklenen zip'i aç
        run: |
          Z=$(git log -1 --diff-filter=AM --name-only --pretty=format: -- '*.zip' | grep -i '\.zip$' | head -1)
          echo "Kullanılan zip: $Z"
          unzip -o -q "$Z" -d .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK derle
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Hata kaydını yaz (Claude okusun diye)
        if: failure()
        run: |
          { echo "run ${{ github.run_number }}"; grep -E "^e: |^w: .*error|What went wrong|AAPT|error:" -A4 build.log || true; echo "----- son satırlar -----"; tail -120 build.log; } > hata.txt
          git config user.name "puf-bot"
          git config user.email "puf-bot@users.noreply.github.com"
          git checkout --orphan logs
          git rm -rf --cached . > /dev/null
          git add -f hata.txt
          git commit -m "build ${{ github.run_number }} hata"
          git push -f origin logs

      - name: APK'yı yükle (Actions)
        uses: actions/upload-artifact@v4
        with:
          name: puf-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: APK'yı yayınla (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: puf APK ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
