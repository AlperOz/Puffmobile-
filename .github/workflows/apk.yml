name: APK derle

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Proje zip'ini aç
        run: |
          if [ -f puf-project.zip ]; then unzip -o -q puf-project.zip -d . ; fi
          ls -la

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK derle
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: APK'yı yükle (Actions)
        uses: actions/upload-artifact@v4
        with:
          name: puf-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: APK'yı yayınla (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: puf APK ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
